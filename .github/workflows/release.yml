name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Gates every downstream job, including the release. Cross-compiled targets in
  # `build` cannot execute their own binaries, so the suite runs here on the
  # three native hosts instead. `build` depends on this, and `release` depends
  # transitively, so a failing test blocks publication.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --release --locked --verbose

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: angkorfetch-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: angkorfetch-linux-aarch64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: angkorfetch-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: angkorfetch-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: angkorfetch-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64-linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/${{ matrix.asset }} angkorfetch
          cd ${{ github.workspace }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/angkorfetch.exe -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Rust binary
        run: cargo build --release

      # Both deb and rpm reject or misinterpret a bare hyphen in a version.
      # rpm refuses outright ("Illegal char '-'"), and for dpkg a hyphen
      # separates the upstream version from the Debian revision. Translating to
      # a tilde is the packaging convention for a prerelease and also sorts
      # correctly: 1.2.0~rc.1 precedes 1.2.0. For a normal release with no
      # hyphen this is a no-op.
      #
      # `tr` rather than "${VER//-/~}": bash applies tilde expansion to the
      # replacement string in a pattern substitution, so the shorthand yields
      # "1.2.0/home/runnerrc.1" instead of "1.2.0~rc.1".
      - name: Derive package version
        id: pkgver
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(printf '%s' "$VER" | tr '-' '~')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "tag version: $VER -> package version: $PKG_VER"

      - name: Build .deb package
        env:
          VER: ${{ steps.pkgver.outputs.pkg_version }}
        run: |
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/bin deb-pkg/usr/share/doc/angkorfetch
          cat > deb-pkg/DEBIAN/control <<EOF
          Package: angkorfetch
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: AMRSKH <inforithseyhacambo@gmail.com>
          Description: A fast, cross-platform system fetch tool
          Homepage: https://github.com/AMRSKH/angkorfetch
          License: MIT
          EOF
          cp target/release/angkorfetch deb-pkg/usr/bin/
          cp README.md deb-pkg/usr/share/doc/angkorfetch/
          dpkg-deb --build deb-pkg "angkorfetch_${VER}_amd64.deb"

      - name: Build .rpm package
        env:
          VER: ${{ steps.pkgver.outputs.pkg_version }}
        run: |
          mkdir -p rpmbuild/{SOURCES,SPECS,RPMS,SRPMS,BUILD}
          cp target/release/angkorfetch rpmbuild/SOURCES/
          cat > rpmbuild/SPECS/angkorfetch.spec <<EOF
          Name: angkorfetch
          Version: $VER
          Release: 1%{?dist}
          Summary: A fast, cross-platform system fetch tool
          License: MIT
          URL: https://github.com/AMRSKH/angkorfetch
          Source0: angkorfetch
          %description
          AngkorFetch is a fast, cross-platform system-info ("fetch") tool.
          %install
          install -Dm755 %{_sourcedir}/angkorfetch %{buildroot}%{_bindir}/angkorfetch
          %files
          %{_bindir}/angkorfetch
          EOF
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/angkorfetch.spec --nodeps
          cp rpmbuild/RPMS/x86_64/*.rpm .

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            *.deb
            *.rpm

  # Must wait on `packages` as well as `build`, otherwise checksums.txt is
  # generated from a partial artifact set and silently omits the .deb and .rpm.
  checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          mv checksums.txt ..

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  # `packages` is required here, not just implied. Without it the release job
  # raced ahead and published before the .deb/.rpm finished uploading.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, packages, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Ordering via `needs` is necessary but not sufficient: a future refactor
      # could reintroduce a gap without anyone noticing until a release ships
      # short. Fail loudly here instead of publishing an incomplete release.
      - name: Verify all expected artifacts are present
        run: |
          cd artifacts
          echo "Downloaded:"
          ls -1
          missing=0
          for f in \
            angkorfetch-linux-x86_64.tar.gz \
            angkorfetch-linux-aarch64.tar.gz \
            angkorfetch-macos-x86_64.tar.gz \
            angkorfetch-macos-aarch64.tar.gz \
            angkorfetch-windows-x86_64.zip \
            checksums.txt
          do
            [ -f "$f" ] || { echo "::error::missing expected artifact $f"; missing=1; }
          done
          for pattern in '*.deb' '*.rpm'; do
            compgen -G "$pattern" > /dev/null \
              || { echo "::error::no artifact matching $pattern"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All expected artifacts present."
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # A hyphen in the tag marks a prerelease (v1.2.0-rc.1, v1.2.0-test).
          # The action defaults to prerelease: false, which would otherwise mark
          # any release candidate as "Latest" and expose it to installers and to
          # the package sync automation.
          prerelease: ${{ contains(github.ref_name, '-') }}
